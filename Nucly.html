
<script>
// GRID COUNTING
if (typeof app !== 'undefined') {
  app.grid = {enabled:false,cellSize:20,mode:'pos',cols:0,rows:0,cells:{},painting:false,lastCell:null};
}
function gridKey(r,c){ return r+','+c; }
function toggleGrid(){ if(!app.grid)return; app.grid.enabled=!app.grid.enabled; if(document.getElementById('gridEnabledVal'))document.getElementById('gridEnabledVal').textContent=app.grid.enabled?'On':'Off'; updateGridLayout(); if(typeof redraw==='function')redraw(); }
function setGridSize(v){ if(!app.grid)return; app.grid.cellSize=Math.max(4,parseInt(v)||20); if(document.getElementById('gridSizeVal'))document.getElementById('gridSizeVal').textContent=app.grid.cellSize; updateGridLayout(); if(typeof redraw==='function')redraw(); }
function setGridMode(m){ if(app.grid) app.grid.mode=m; }
function clearGrid(){ if(!app.grid)return; app.grid.cells={}; updateGridCounts(); if(typeof redraw==='function')redraw(); }
function updateGridLayout(){ if(!app.grid||!app.imageLoaded||!window.sourceImage||!sourceImage.width){ app.grid.cols=app.grid.rows=0; return;} const cs=app.grid.cellSize; app.grid.cols=Math.ceil(sourceImage.width/cs); app.grid.rows=Math.ceil(sourceImage.height/cs); }
function gridCellAt(x,y){ if(!app.grid||!app.grid.enabled||app.grid.cols==0)return null; const cs=app.grid.cellSize,r=Math.floor(y/cs),c=Math.floor(x/cs); if(r<0||c<0||r>=app.grid.rows||c>=app.grid.cols)return null; return {r,c}; }
function setGridCell(x,y,mode){ const g=gridCellAt(x,y); if(!g)return; const k=g.r+','+g.c; if(mode=='erase'){ delete app.grid.cells[k]; } else { app.grid.cells[k]=mode; } updateGridCounts(); }
function paintGridAt(x,y){ setGridCell(x,y, app.grid?app.grid.mode:'pos'); }
function updateGridCounts(){ let gp=0,gn=0,ge=0; if(app&&app.grid){ for(let kk in app.grid.cells){ const v=app.grid.cells[kk]; if(v=='pos')gp++; else if(v=='neg')gn++; else if(v=='excl')ge++; } } const gt=gp+gn, gpp=gt==0?0:(gp/gt)*100; if(document.getElementById('gPos'))document.getElementById('gPos').textContent=gp; if(document.getElementById('gNeg'))document.getElementById('gNeg').textContent=gn; if(document.getElementById('gExcl'))document.getElementById('gExcl').textContent=ge; if(document.getElementById('gTotal'))document.getElementById('gTotal').textContent=gt; if(document.getElementById('gPct'))document.getElementById('gPct').textContent=gpp.toFixed(1)+'%'; }
</script><script>
// GRID COUNTING EXT
function gridDrawOverlay(ctx, imgW, imgH, panX, panY, zoom){
  if(!app.grid||!app.grid.enabled||app.grid.cols==0) return;
  const cs=app.grid.cellSize;
  ctx.save();
  ctx.strokeStyle='rgba(0,0,0,0.25)';
  ctx.lineWidth=1/zoom;
  const startC=Math.max(0,Math.floor(-panX/(cs*zoom)));
  const endC=Math.min(app.grid.cols, Math.ceil((imgW*zoom - panX)/(cs*zoom)));
  const startR=Math.max(0,Math.floor(-panY/(cs*zoom)));
  const endR=Math.min(app.grid.rows, Math.ceil((imgH*zoom - panY)/(cs*zoom)));
  for(let r=startR;r<endR;r++){
    for(let c=startC;c<endC;c++){
      const k=r+','+c; const v=app.grid.cells[k]; if(!v) continue;
      const x=c*cs, y=r*cs, w=cs, h=cs;
      if(v=='pos'){ ctx.fillStyle='rgba(255,0,0,0.25)'; ctx.fillRect(x,y,w,h); }
      else if(v=='neg'){ ctx.fillStyle='rgba(0,0,255,0.25)'; ctx.fillRect(x,y,w,h); }
      else if(v=='excl'){ ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(x,y,w,h); }
    }
  }
  ctx.beginPath();
  for(let c=0;c<=app.grid.cols;c++){ ctx.moveTo(c*cs,0); ctx.lineTo(c*cs,imgH); }
  for(let r=0;r<=app.grid.rows;r++){ ctx.moveTo(0,r*cs); ctx.lineTo(imgW,r*cs); }
  ctx.stroke();
  ctx.restore();
}
</script>
